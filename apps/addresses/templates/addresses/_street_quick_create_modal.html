{% extends "modal_base.html" %}
{% block modal_body %}
<h2>Новая улица</h2>
<form hx-post="{% url 'addresses:street_quick_create' %}" hx-target="#modal-root" hx-swap="innerHTML">
    {% csrf_token %}
    {% for field in form %}
    <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
    </div>
    {% endfor %}
    <button class="btn" type="submit">Сохранить</button>
    <button type="button" class="btn btn-secondary" onclick="this.closest('.modal-backdrop').remove();">Отмена</button>
</form>
{% endblock %}
