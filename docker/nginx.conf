server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        # Резолвим "web" через встроенный DNS Docker (127.0.0.11) с коротким TTL,
        # а не один раз при старте nginx — иначе после пересборки/пересоздания
        # web-контейнера (например, `docker compose up -d --build web`) nginx
        # продолжает стучаться на старый IP и отдаёт 502, пока его самого не
        # перезапустят. Переменная в proxy_pass заставляет nginx резолвить
        # заново, а не кэшировать адрес на весь свой жизненный цикл.
        resolver 127.0.0.11 valid=10s;
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
