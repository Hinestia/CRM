# PostgreSQL сюда сознательно не включён — он ставится нативно на хост
# (apt), общий для нескольких проектов на сервере, и живёт своим циклом,
# отдельно от `docker compose down` этого проекта. Настройка — в README.md
# ("PostgreSQL на хосте"). Контейнеры достают его через host.docker.internal
# (см. extra_hosts у web/celery_worker/celery_beat).

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

  celery_worker:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    entrypoint: ["docker/celery-entrypoint.sh"]
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
    volumes:
      - media_data:/app/media

  celery_beat:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    entrypoint: ["docker/celery-entrypoint.sh"]
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web

volumes:
  static_data:
  media_data:
