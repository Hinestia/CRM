# PostgreSQL сюда сознательно не включён — он ставится нативно на хост
# (apt), общий для нескольких проектов на сервере, и живёт своим циклом,
# отдельно от `docker compose down` этого проекта. Настройка — в README.md
# ("PostgreSQL на хосте").
#
# Подсеть compose-проекта зафиксирована ниже (networks.default.ipam) —
# без этого Docker выдаёт её динамически (172.18.0.0/16, 172.19.0.0/16...),
# а `host.docker.internal:host-gateway` в некоторых конфигурациях резолвится
# в адрес ДРУГОЙ, дефолтной сети docker0, а не в шлюз этой сети — из
# контейнера пакеты до Postgres на хосте тогда просто не доходят. Поэтому
# контейнеры обращаются к Postgres по фиксированному IP шлюза этой сети
# (POSTGRES_HOST=172.28.0.1 в .env), а не по имени host.docker.internal.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_started
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

  celery_worker:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    entrypoint: ["docker/celery-entrypoint.sh"]
    env_file: .env
    depends_on:
      redis:
        condition: service_started
    volumes:
      - media_data:/app/media

  celery_beat:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    entrypoint: ["docker/celery-entrypoint.sh"]
    env_file: .env
    depends_on:
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  static_data:
  media_data:
